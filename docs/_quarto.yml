project:
  type: website
  output-dir: _site
  render:
    - '*.qmd'
  pre-render:
    - bash scripts/build-demo.sh
  resources:
    - demo-assets/**
website:
  title: xstate-nats
  site-url: https://jr200-labs.github.io/xstate-nats/
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: getting-started.qmd
      - href: demo.qmd
        text: Live demo
  sidebar:
    style: docked
    contents:
      - getting-started.qmd
      - subjects.qmd
      - key-value.qmd
      - credentials.qmd
      - reference.qmd
      - observability.qmd
      - demo.qmd
format:
  html:
    theme: cosmo
    toc: true
    css: styles.css
    code-copy: true
