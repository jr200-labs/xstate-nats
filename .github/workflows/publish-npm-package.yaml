# GENERATED/SHARED WORKFLOW: copied into consuming repos by sync-shared.
# Do not edit in consuming repos; change jr200-labs/github-action-templates and sync.
name: publish-npm-package
run-name: ${{ github.event.client_payload['release-tag'] || format('{0} by @{1}', github.event_name, github.actor) }}

# Triggered by release-please publishing a tag. Builds and publishes the
# package to npmjs.com via pnpm publish. Verbatim across consumers; each
# consumer must set the NPMJS_API_TOKEN secret.

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner pool
        required: false
        type: choice
        default: configured
        options:
          - configured
          - self-hosted
          - github-hosted
      checkout-ref:
        description: "checkout ref"
        required: false
        type: string
        default: "refs/heads/master"
      pnpm-run-test:
        description: "Run pnpm test:run before publish"
        required: false
        type: string
        default: "true"
      pnpm-publish-args:
        description: "Additional pnpm publish args"
        required: false
        type: string
        default: ""
      preview-id:
        description: "Publish an immutable -pr preview without changing the latest tag"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  configure:
    uses: jr200-labs/github-action-templates/.github/workflows/preconfigure.yaml@master
    with:
      event_name: ${{ toJson(github.event_name) }}
      event: ${{ toJson(github.event) }}
      runner: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'self-hosted' && 'self-hosted' || github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github-hosted' && 'ubuntu-latest' || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}

  main:
    needs: configure
    uses: jr200-labs/github-action-templates/.github/workflows/build_publish_npmjs.yaml@master
    with:
      checkout-ref: ${{ fromJson(needs.configure.outputs.context).checkout-ref }}
      pnpm-run-test: ${{ github.event.inputs.pnpm-run-test || 'true' }}
      pnpm-publish-args: ${{ github.event.inputs.pnpm-publish-args || '' }}
      preview-id: ${{ github.event.inputs.preview-id || '' }}
      runner: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'self-hosted' && 'self-hosted' || github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github-hosted' && 'ubuntu-latest' || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    secrets:
      npmjs_api_token: ${{ secrets.NPMJS_API_TOKEN }}

  notify-renovate:
    needs: [configure, main]
    if: github.event_name == 'repository_dispatch'
    uses: jr200-labs/github-action-templates/.github/workflows/notify_artifact_published.yaml@master
    with:
      checkout-ref: ${{ fromJson(needs.configure.outputs.context).checkout-ref }}
      publisher: npm
      component: ${{ fromJson(needs.configure.outputs.context).component || '.' }}
      version: ${{ fromJson(needs.configure.outputs.context).tag }}
      source-sha: ${{ fromJson(needs.configure.outputs.context).sha || '' }}
      dispatch-client-id: ${{ vars.RENOVATE_DISPATCH_CLIENT_ID || vars.INTEGRATION_CLIENT_ID }}
      runner: ${{ fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    secrets:
      dispatch_app_private_key: ${{ secrets.RENOVATE_DISPATCH_APP_PRIVATE_KEY }}
      integration_app_private_key: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
